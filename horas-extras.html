<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de Horas Extras CLT 2026 - Grátis com Adicional Noturno e DSR</title>
<meta name="description" content="Calcule suas horas extras de 50% e 100%, adicional noturno e reflexo no DSR. Calculadora gratuita e atualizada com as regras da CLT." />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 20px;
    color: #1a1a1a;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
  }
  .erro {
    color: #c0392b;
    margin-top: 14px;
    font-size: 0.9rem;
  }
  .resultado {
    margin-top: 20px;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .resultado p {
    margin: 6px 0;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
  }
  .resultado .total {
    font-weight: 700;
    font-size: 1.1rem;
    border-top: 1px solid #eee;
    padding-top: 10px;
    margin-top: 10px;
  }
  .aviso {
    font-size: 0.75rem;
    color: #777;
    margin-top: 14px;
  }
  a.voltar {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: #555;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="voltar" href="index.html">&larr; Voltar</a>
    <h1>Calculadora de Horas Extras</h1>

    <form id="form-horas-extras">
      <label for="salarioBase">Salário base (R$)</label>
      <input type="number" step="0.01" id="salarioBase" required placeholder="Ex: 2500" />

      <label for="jornadaMensal">Jornada mensal (horas)</label>
      <input type="number" id="jornadaMensal" value="220" />

      <label for="horasExtras50">Horas extras 50% no mês</label>
      <input type="number" step="0.5" id="horasExtras50" placeholder="Ex: 10" />

      <label for="horasExtras100">Horas extras 100% (domingos/feriados)</label>
      <input type="number" step="0.5" id="horasExtras100" placeholder="Ex: 4" />

      <label for="horasAdicionalNoturno">Horas em adicional noturno (22h-5h)</label>
      <input type="number" step="0.5" id="horasAdicionalNoturno" placeholder="Ex: 8" />

      <label for="diasDomingoFeriado">Dias de domingo/feriado trabalhados</label>
      <input type="number" id="diasDomingoFeriado" placeholder="Ex: 2" />

      <button type="submit" id="btn-calcular">Calcular</button>
    </form>

    <div class="erro" id="erro" style="display:none;"></div>

    <div class="resultado" id="resultado" style="display:none;">
      <h2 style="font-size:1.05rem; margin-bottom:8px;">Resultado</h2>
      <p><span>Valor da hora normal</span><span id="r-valorHoraNormal"></span></p>
      <p><span>Total horas extras 50%</span><span id="r-totalHoras50"></span></p>
      <p><span>Total horas extras 100%</span><span id="r-totalHoras100"></span></p>
      <p><span>Total adicional noturno</span><span id="r-totalAdicionalNoturno"></span></p>
      <p><span>Reflexo no DSR</span><span id="r-reflexoDSR"></span></p>
      <p class="total"><span>Total geral</span><span id="r-totalGeral"></span></p>
      <p class="aviso">Este cálculo é uma estimativa. Consulte um contador ou advogado trabalhista.</p>
    </div>
  </div>

  <script>
    const VAL_TOWN_URL = "https://Pauloeliseu1983santos--38137c2686ed11f182de1607ee4eb77e.web.val.run";

    function formatarMoeda(valor) {
      return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    document.getElementById("form-horas-extras").addEventListener("submit", async function (e) {
      e.preventDefault();

      const erroEl = document.getElementById("erro");
      const resultadoEl = document.getElementById("resultado");
      const btn = document.getElementById("btn-calcular");

      erroEl.style.display = "none";
      resultadoEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Calculando...";

      const payload = {
        salarioBase: parseFloat(document.getElementById("salarioBase").value) || 0,
        jornadaMensal: parseFloat(document.getElementById("jornadaMensal").value) || 220,
        horasExtras50: parseFloat(document.getElementById("horasExtras50").value) || 0,
        horasExtras100: parseFloat(document.getElementById("horasExtras100").value) || 0,
        horasAdicionalNoturno: parseFloat(document.getElementById("horasAdicionalNoturno").value) || 0,
        diasDomingoFeriado: parseFloat(document.getElementById("diasDomingoFeriado").value) || 0,
      };

      try {
        const resp = await fetch(VAL_TOWN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await resp.json();

        if (!resp.ok) {
          erroEl.textContent = data.error || "Erro ao calcular";
          erroEl.style.display = "block";
          return;
        }

        const r = data.resultado;
        document.getElementById("r-valorHoraNormal").textContent = formatarMoeda(r.valorHoraNormal);
        document.getElementById("r-totalHoras50").textContent = formatarMoeda(r.totalHoras50);
        document.getElementById("r-totalHoras100").textContent = formatarMoeda(r.totalHoras100);
        document.getElementById("r-totalAdicionalNoturno").textContent = formatarMoeda(r.totalAdicionalNoturno);
        document.getElementById("r-reflexoDSR").textContent = formatarMoeda(r.reflexoDSR);
        document.getElementById("r-totalGeral").textContent = formatarMoeda(r.totalGeral);

        resultadoEl.style.display = "block";
      } catch (err) {
        erroEl.textContent = "Não foi possível conectar ao servidor de cálculo. Tente novamente.";
        erroEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Calcular";
      }
    });
  </script>
</body>
</html>
